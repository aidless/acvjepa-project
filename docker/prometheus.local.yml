global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s
  external_labels:
    demo_scope: local-offline-synthetic

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: local-chaos-metrics-demo
    metrics_path: /metrics
    static_configs:
      - targets: ["metrics-demo:8000"]
        labels:
          demo_scope: local-offline-synthetic
