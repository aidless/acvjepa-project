name: Claim drift

on:
  pull_request:
  push:
    branches: [main, master]

# Reads the tree and compares claims to scripts. No secrets, deploy, or cache.
permissions:
  contents: read

jobs:
  drift:
    name: Verification claims match the tree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Drift guard
        run: python3 scripts/check_verification_drift.py
