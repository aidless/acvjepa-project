name: PR Checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Syntax check (compileall)
        run: python -m compileall -q . || true
      - name: Tests if present
        run: |
          if [ -f requirements.txt ]; then pip install -q -r requirements.txt || true; fi
          if command -v pytest >/dev/null 2>&1; then pytest -q; else echo "no pytest"; fi
