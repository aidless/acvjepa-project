name: Offline Failpoint Chaos Contract

on:
  pull_request:
    paths:
      - '**.py'
      - 'monitoring/**'
      - '.github/workflows/failpoint-chaos-ci.yml'
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'monitoring/**'
      - '.github/workflows/failpoint-chaos-ci.yml'
  workflow_dispatch:

# The workflow only reads repository contents and uploads CI artifacts.
# It deliberately has no cloud, cluster, deployment, package publish or secret permission.
permissions:
  contents: read

concurrency:
  group: offline-failpoint-chaos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    name: Offline failpoint, cache, and observability contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          check-latest: false

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-virtualenv=false \
            'prometheus-client==0.20.0' \
            'PyYAML==6.0.2'

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Compile offline contract modules
        run: |
          python -m py_compile \
            distributed_training_observability.py \
            elastic_data_cursor_ledger.py \
            verified_checkpoint_cache.py \
            heterogeneous_microbatch_chaos_framework.py \
            checkpoint_cache_load_shedding_simulator.py \
            checkpoint_integrity_corruption_demo.py \
            recovery_deployment_arbiter.py \
            threadsafe_checkpoint_load_gate.py \
            run_failpoint_observability_drill.py \
            local_chaos_metrics_server.py \
            validate_local_compose.py \
            validate_kubernetes_chaos_lab.py \
            test_heterogeneous_microbatch_failpoints.py

      - name: Run shared offline chaos contract
        run: ARTIFACT_DIR=artifacts scripts/run_offline_chaos_contract.sh

      - name: Upload sanitized offline diagnostics
        if: always()
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v4.6.2
        with:
          name: offline-failpoint-chaos-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
